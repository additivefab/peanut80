<text x="455.0" y="906" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#172d3f" font-weight="400" text-anchor="start">精密光学编码器/直接位移参考</text>
<text x="810.0" y="906" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#172d3f" font-weight="400" text-anchor="start">重新核算体积、成本、计量链</text>
<text x="100" y="1000" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#172d3f" font-weight="400" text-anchor="start">主机上电时轴静止等待编码器初始化；运行时同步监测非法AB跳变、丢脉冲、反转和两轮差值。</text>
