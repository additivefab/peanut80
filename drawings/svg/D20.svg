<text x="1080" y="1095" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#cb462e" font-weight="400" text-anchor="start">初步工程设计 · 非加工/PCB制造放行图</text>
<rect x="60" y="175" width="1480" height="80" rx="0" fill="#143c61" stroke="none" stroke-width="1.5"/>
