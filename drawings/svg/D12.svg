<text x="592" y="270" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#172d3f" font-weight="400" text-anchor="start">有效直径随压紧、磨损和温度变化</text>
<rect x="1080" y="205" width="450" height="140" rx="6" fill="#edf4f8" stroke="#226da6" stroke-width="1.3"/>
