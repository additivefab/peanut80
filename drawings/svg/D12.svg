<text x="1092" y="270" font-family="Noto Sans CJK SC, sans-serif" font-size="17" fill="#172d3f" font-weight="400" text-anchor="start">入口计量＋出口复核，不把电机步数当片长</text>
<line x1="490" y1="275" x2="570" y2="275" stroke="#226da6" stroke-width="3" marker-end="url(#arr)" />
